name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        env:
          PYTHONPATH: src
        run: |
          python -m szl_openshell_receipts.cli ingest-log examples/openshell.sample.log --policy examples/policy.readonly-audit.yaml --commit "$GITHUB_SHA" --out r.jsonl
          python -m szl_openshell_receipts.cli verify r.jsonl
          python -m szl_openshell_receipts.cli delta examples/policy.before.json examples/policy.after.json
          python -m szl_openshell_receipts.cli controls governance/controls.json
  observation-checker:
    # Full reproduction of reference/observation_checker. Every output is regenerated in a
    # scratch copy and must match the committed bytes; tracked files are never rewritten.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Integrity
        working-directory: reference/observation_checker
        run: sha256sum --check --strict SHA256SUMS
      - name: Reproduce
        run: |
          work="$RUNNER_TEMP/observation_checker"
          cp -r reference/observation_checker "$work"
          cd "$work"
          python -B -m unittest -v test_observation_checker.py
          python -B verify.py
          python -B independent_review/verify.py > /dev/null
          python -B independent_review/metamorphic.py
          python -B independent_review/runtime_review.py > /dev/null
          for f in case_results.json example_report.json independent_review/verification.json \
                   independent_review/metamorphic-results.json independent_review/runtime-review-results.json; do
            cmp "$f" "$GITHUB_WORKSPACE/reference/observation_checker/$f"
          done
