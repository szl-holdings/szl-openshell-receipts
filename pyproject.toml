[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-openshell-receipts"
version = "0.3.1"
description = "Governed, hash-chained receipts and an independent reach-delta witness for sandboxed agent runtimes."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
szl-openshell-receipts = "szl_openshell_receipts.cli:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-openshell-receipts"
Source = "https://github.com/szl-holdings/szl-openshell-receipts"
Issues = "https://github.com/szl-holdings/szl-openshell-receipts/issues"
Changelog = "https://github.com/szl-holdings/szl-openshell-receipts/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.szl.release]
import_names = ["szl_openshell_receipts"] # wheel top-level import names; the release gate fails if the built wheel differs
